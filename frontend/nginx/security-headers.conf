# Included in every location: nginx drops inherited add_header directives
# whenever a location declares its own, so they are repeated via this snippet.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Scripts and API calls are same-origin only; fonts come from Google Fonts.
# React applies the few dynamic styles through the CSSOM, which CSP allows without 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Enable once the site is served over HTTPS only:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
